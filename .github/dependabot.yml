version: 2
updates:
  # ---------------------------------------------------------
  # Go Dependencies (go.mod, go.sum)
  # ---------------------------------------------------------
  - package-ecosystem: "gomod"
    directory: "backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    assignees:
      - "ajaxe"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------
  # Node.js Dependencies (package.json, lockfile)
  # ---------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    assignees:
      - "ajaxe"
    groups:
      node-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
